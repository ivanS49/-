            li.className = "list-item";
            const desc = dict[se.descKey] || se.descKey;
            li.innerHTML = '<a class="news-link" href="' + se.url + '"><div class="title">' + se.name + '</div><div class="desc">' + desc + '</div></a>';
            list.appendChild(li);
        });
    }

    function init() {
        renderSearchEngines();
        const continentsList = document.getElementById("continents-list");
        if (!continentsList) return;
        continentsList.innerHTML = "";
        for (const continent in data) {
            const li = document.createElement("li");
            li.className = "list-item";
            li.innerHTML = '<div class="title">' + continent + '</div><div>→</div>';
            li.onclick = (function(c) { return function() { loadCountries(c); }; })(continent);
            continentsList.appendChild(li);
        }
    }

    function showContinents() {
        document.getElementById("continents-view").classList.remove("hidden");
        document.getElementById("countries-view").classList.add("hidden");
        document.getElementById("news-view").classList.add("hidden");
    }

    function loadCountries(continent) {
        currentContinent = continent;
        const countriesList = document.getElementById("countries-list");
        if (!countriesList) return;
        countriesList.innerHTML = "";
        document.getElementById("country-title").textContent = continent;

        const countries = data[continent] || {};
        for (const country in countries) {
            const li = document.createElement("li");
            li.className = "list-item";
            li.innerHTML = '<div class="title">' + country + '</div><div>→</div>';
            li.onclick = (function(c) { return function() { loadNews(c); }; })(country);
            countriesList.appendChild(li);
        }
        document.getElementById("continents-view").classList.add("hidden");
        document.getElementById("countries-view").classList.remove("hidden");
    }

    function showCountries() {
        document.getElementById("countries-view").classList.remove("hidden");
        document.getElementById("news-view").classList.add("hidden");
    }

    function loadNews(country) {
        const newsList = document.getElementById("news-list");
        if (!newsList) return;
        newsList.innerHTML = "";
        document.getElementById("news-title").textContent = country;
        
        let sites = [];
        if (currentContinent && data[currentContinent] && data[currentContinent][country]) {
            sites = data[currentContinent][country];
        }
        const dict = langs[currentLang] || langs["ru"];
        const customSites = JSON.parse(localStorage.getItem("custom_sites_" + country) || "[]");
        
        sites.forEach(site => {
            const li = document.createElement("li");
            li.className = "list-item";
            const desc = dict[site.descKey] || site.descKey;
            li.innerHTML = '<a class="news-link" href="' + site.url + '"><div class="title">' + site.name + '</div><div class="desc">' + desc + '</div></a>';
            newsList.appendChild(li);
        });

        customSites.forEach(site => {
            const li = document.createElement("li");
            li.className = "list-item";
            li.innerHTML = '<a class="news-link" href="' + site.url + '"><div class="title">' + site.name + '</div><div class="desc">' + dict.customSiteDesc + '</div></a>';
            newsList.appendChild(li);
        });

        const btnLi = document.createElement("li");
        btnLi.className = "list-item";
        btnLi.style.justifyContent = "center";
        btnLi.style.backgroundColor = "#333";
        btnLi.innerHTML = '<div class="title" style="color: #4CAF50;">' + dict.addSite + '</div>';
        btnLi.onclick = function() { addCustomSite(country); };
        newsList.appendChild(btnLi);
        
        document.getElementById("countries-view").classList.add("hidden");
        document.getElementById("news-view").classList.remove("hidden");
    }

    function addCustomSite(country) {
        const dict = langs[currentLang] || langs["ru"];
        const name = prompt(dict.promptName);
        if (!name) return;
        let url = prompt(dict.promptUrl);
        if (!url) return;
        if (!url.startsWith("http")) url = "https://" + url;
        const customSites = JSON.parse(localStorage.getItem("custom_sites_" + country) || "[]");
        customSites.push({ name: name, url: url });
        localStorage.setItem("custom_sites_" + country, JSON.stringify(customSites));
        loadNews(country);
    }

    // Run init immediately and on load
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
</script>
</body>
</html>
